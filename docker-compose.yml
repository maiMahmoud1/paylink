services:
  db:
    image: postgres:16
    container_name: paylink-db
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink123
      POSTGRES_DB: paylink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: paylink-api
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: